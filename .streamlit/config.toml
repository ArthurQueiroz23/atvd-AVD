
# Identidade visual do app: "noite de jogo" — gramado escuro, verde de estádio e linhas de cal.
# O tema escuro é fixo para o visual ficar igual em qualquer computador.

[theme]
base = "dark"
font = "sans serif"

# Cores principais
primaryColor = "#22b455"
textColor = "#eef5ee"

# Fundos e bordas
backgroundColor = "#0b1a12"
secondaryBackgroundColor = "#12261b"
borderColor = "#24402f"
